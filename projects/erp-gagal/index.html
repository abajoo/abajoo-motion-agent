<!doctype html><html lang="id"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102c27;color:#f8f0dc;font-family:Arial,sans-serif}
.stage{width:1920px;height:1080px;position:absolute;overflow:hidden;background:radial-gradient(circle at 55% 50%,#236b56,#102c27 72%)}
.orb{position:absolute;border:3px solid #d9ad63;border-radius:50%;width:450px;height:450px;left:740px;top:310px;box-shadow:0 0 120px #c89d484a}
.line{position:absolute;left:0;top:540px;width:1920px;height:4px;background:#d9ad63;transform-origin:left}
.kicker{position:absolute;left:180px;top:210px;font-size:34px;letter-spacing:8px;color:#d9ad63}
.headline{position:absolute;left:180px;top:355px;width:1510px;font-size:88px;font-weight:800;line-height:1.1}
.sub{position:absolute;left:185px;top:700px;width:1400px;font-size:38px;line-height:1.3}
.footer{position:absolute;bottom:60px;left:180px;font-size:27px;letter-spacing:3px;color:#d9ad63}
.progress{position:absolute;bottom:0;height:10px;background:#d9ad63}
</style></head><body><main class="stage"><div class="orb" id="orb"></div><div class="line" id="line"></div><div class="kicker" id="kicker"></div><div class="headline" id="headline"></div><div class="sub" id="sub"></div><div class="footer">ABAJOO · UNDERSTANDING FIRST, SOLUTION THEN</div><div class="progress" id="progress"></div></main><script>
const scenes=[
['PERTANYAAN BESAR','Mengapa implementasi ERP bisa gagal?','Tidak selalu karena software. Masalahnya sering dimulai sebelum sistem digunakan.'],
['BAB 1 · TUJUAN','Membeli sistem tanpa memahami hasil','Keberhasilan bukan sekadar fitur terpasang, melainkan hasil bisnis yang dicapai.'],
['BAB 2 · PROSES','Proses belum disepakati','ERP membutuhkan keputusan lintas fungsi, bukan sekadar memindahkan formulir lama.'],
['BAB 3 · DATA','Data buruk tetap menjadi masalah','Master data, stok awal, dan saldo pembukaan harus diperiksa sebelum migrasi.'],
['BAB 4 · MANUSIA','Pengguna harus mencoba sendiri','SIT memeriksa integrasi; UAT memeriksa apakah skenario bisnis dapat dijalankan pengguna.'],
['BAB 5 · PERUBAHAN','Scope berubah tanpa kendali','Setiap perubahan memengaruhi waktu, biaya, mutu, dan proses.'],
['PENUTUP','Understanding First, Solution Then','Mulailah dari outcome, proses yang jelas, data yang terpercaya, dan kesiapan manusia.']
];
let TOTAL=300;
function render(t){t=Math.max(0,Math.min(TOTAL-0.001,t));const per=TOTAL/scenes.length,idx=Math.min(scenes.length-1,Math.floor(t/per)),local=t-idx*per,s=scenes[idx];
const opacity=Math.max(0,Math.min(1,local/0.7,(per-local)/0.7));
for(const [id,val] of [['kicker',s[0]],['headline',s[1]],['sub',s[2]]]){const el=document.getElementById(id);el.textContent=val;el.style.opacity=opacity;el.style.transform='translateY('+(1-opacity)*35+'px)'}
document.getElementById('orb').style.transform='translate('+Math.sin(t*.18)*220+'px,'+Math.cos(t*.12)*95+'px) scale('+(1+.12*Math.sin(t*.2))+')';
document.getElementById('line').style.transform='scaleX('+(0.3+0.7*(0.5+0.5*Math.sin(t*.07)))+')';
document.getElementById('progress').style.width=(100*t/TOTAL)+'%';
}
window.setDuration=(s)=>{TOTAL=s;render(0)};window.renderAt=render;render(0);
if(!location.search.includes('capture')){let start=performance.now();function tick(now){render(((now-start)/1000)%TOTAL);requestAnimationFrame(tick)}requestAnimationFrame(tick)}
</script></body></html>
